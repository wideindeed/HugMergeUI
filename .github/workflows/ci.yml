name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # backend/tests/ hits the real Hugging Face Hub for config.json and
      # (for a few tests) real model.safetensors weights - by design, this
      # project avoids mocking the thing it's actually validating. Caching
      # the hub download dir keeps repeat runs fast; the first run on a
      # cold cache pays the download cost once.
      - name: Cache Hugging Face Hub downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-${{ hashFiles('backend/tests/**/*.py') }}
          restore-keys: |
            hf-hub-

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # -m "not slow" matches backend/pytest.ini's own convention: skips the
      # one test that downloads a ~6GB sharded model, keeps everything else.
      - name: Run backend tests
        working-directory: backend
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m pytest -m "not slow" -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check and build
        working-directory: frontend
        run: npm run build
